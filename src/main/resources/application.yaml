server:
  port: 8080

app:
  name: To-Do List Manager
  version: 1.0.0
  upload-dir: uploads

api:
  version: 2.0.0

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
