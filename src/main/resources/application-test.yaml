logging:
  level:
    root: INFO
    com.azat.h1: DEBUG

spring:
  datasource:
    url: jdbc:h2:mem:todo_manager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

external-api:
  base-url: http://localhost:18080/external/v1
  connect-timeout-ms: 500
  read-timeout-ms: 700
  user-agent: h1-gateway-test/1.0

resilience4j:
  circuitbreaker:
    instances:
      externalApi:
        sliding-window-type: count_based
        sliding-window-size: 3
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        permitted-number-of-calls-in-half-open-state: 1
        wait-duration-in-open-state: 1s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        ignore-exceptions:
          - com.azat.h1.exception.ExternalTaskNotFoundException
  ratelimiter:
    instances:
      externalApi:
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 0
