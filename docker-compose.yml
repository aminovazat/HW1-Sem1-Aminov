services:
  postgres:
    image: postgres:16-alpine
    container_name: h1-todo-postgres
    environment:
      POSTGRES_DB: todo_manager
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
